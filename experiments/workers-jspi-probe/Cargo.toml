[package]
name = "workers-jspi-probe"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "=0.50.0", features = ["default", "async-spawn", "inter-task-wakeup"] }

[profile.release]
opt-level = "s"

# Deliberately its own workspace root: the probe must build with only wit-bindgen,
# independent of the fn0 workspace's lockfile and feature unification.
[workspace]
