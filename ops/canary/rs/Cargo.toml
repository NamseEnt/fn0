[workspace]

[package]
name = "fn0-ops-canary"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
cookie = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
tracing = "0.1"
forte-json = "=0.1.3"
forte-sdk = "=0.11.0"
doc-db = { package = "fn0-doc-db", version = "=0.4.16" }
object-storage = { package = "fn0-object-storage", version = "=0.5.9" }

[build-dependencies]
forte-codegen = "=0.5.1"
