[package]
name = "hq"
version = "0.1.0"
edition = "2024"

[profile.release]
debug = true

[dependencies]
async-trait = "0.1"
chrono = "0.4.42"
libsql = "0.9"
aws-config = "1"
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }
uuid = { version = "1", features = ["v4"] }
color-eyre = "0.6.5"
dashmap = "6.1.0"
futures = "0.3.31"
reqwest = { version = "0.12.24", default-features = false, features = [
    "rustls-tls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hyper = { version = "1", features = ["full"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["full"] }
oci-rust-sdk = { path = "../oci-rust-sdk", features = ["core"] }
base64 = "0.22.1"
opentelemetry = { version = "0.31.0", features = ["logs", "metrics"] }
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31.0", features = [
    "grpc-tonic",
    "reqwest-client",
    "metrics",
    "logs",
] }
tracing-opentelemetry = "0.32.0"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tracing = "0.1.43"
schemars = "0.8"
rustls = "0.23.35"
bytes = "1.11.0"
singleflight = "0.3.0"
boxcar = "0.2.14"
russh = "0.60.0"

[dev-dependencies]
wiremock = "0.6"
mockall = "0.13"

[build-dependencies]
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
