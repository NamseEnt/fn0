[package]
name = "fn0-worker"
version = "0.3.6"
edition = "2024"
description = "Worker binary for the fn0 FaaS platform"
license = "AGPL-3.0-only"
repository = "https://github.com/NamseEnt/fn0"

[profile.release]
debug = true

[dependencies]
fn0 = "=0.2.12"
adapt-cache = { package = "fn0-adapt-cache", version = "0.1.2" }
futures = "0.3"
aws-config = { version = "1.1.7", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "=1.115.0", default-features = false }
bytes = "1"
base64 = "0.22"
color-eyre = "0.6"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
rustls = "=0.23.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-opentelemetry = "0.32"
opentelemetry = { version = "0.31", features = ["logs", "metrics"] }
opentelemetry_sdk = { version = "0.31", features = ["logs", "rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = ["http-proto", "reqwest-client", "metrics", "logs"] }
opentelemetry-http = { version = "0.31", features = ["reqwest"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
http = "1"
async-trait = "0.1"
anyhow = "1"
zstd = "0.13"
tar = "0.4"
aes-gcm = "0.10"
opentelemetry-appender-tracing = "0.31"
