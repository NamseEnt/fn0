# Copyright 2018-2025 the Deno authors. MIT license.

[package]
name = "fn0-deno-web"
version = "0.256.0"
authors = ["the Deno authors"]
edition = "2024"
license = "MIT"
repository = "https://github.com/NamseEnt/fn0"
description = "Collection of Web APIs (fn0 fork of deno_web with MessagePort support)"

[lib]
path = "lib.rs"

[dependencies]
async-trait = "0.1.73"
base64-simd = "0.8"
bytes = "1.4.0"
deno_core = "0.394.0"
deno_error = "=0.7.1"
deno_features = "0.38.0"
encoding_rs = "=0.8.35"
flate2 = { version = "1.0.30", features = ["default"] }
futures = "0.3.31"
serde = { version = "1.0.149", features = ["derive"] }
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["full"] }
urlpattern = "0.3.0"
uuid = { version = "1.3.0", features = ["serde", "v4"] }
