# Copyright 2018-2026 the Deno authors. MIT license.

[package]
name = "fn0-deno-crypto"
version = "0.255.0"
authors = ["the Deno authors"]
edition = "2024"
license = "MIT"
repository = "https://github.com/NamseEnt/fn0"
description = "Web Cryptography API implementation (fn0 fork of deno_crypto without deno_node and deno_web dependencies)"

[lib]
path = "lib.rs"

[dependencies]
aes = "=0.8.3"
aes-gcm = "0.10"
aes-kw = { version = "0.2.1", features = ["alloc"] }
aws-lc-rs = "1.16.1"
base64 = "0.22.1"
cbc = { version = "=0.1.2", features = ["alloc"] }
const-oid = "0.9.5"
ctr = { version = "0.9.2", features = ["alloc"] }
curve25519-dalek = "4.1.3"
deno_core = "0.394.0"
deno_error = "=0.7.1"
ecdsa = "0.16.9"
ed448-goldilocks = "0.14.0-pre.10"
elliptic-curve = { version = "0.13.4", features = ["alloc", "arithmetic", "ecdh", "std", "pem", "jwk"] }
num-traits = "0.2.19"
ocb3 = "0.1.0"
once_cell = "1.17.1"
p256 = { version = "0.13.2", features = ["ecdh", "jwk", "ecdsa"] }
p384 = { version = "0.13.0", features = ["ecdh", "jwk", "ecdsa"] }
p521 = { version = "0.13.3", features = ["ecdh", "ecdsa", "jwk", "pkcs8"] }
rand = "=0.8.5"
rsa = { version = "0.9.9", default-features = false, features = ["std", "pem", "hazmat"] }
serde = { version = "1.0.149", features = ["derive"] }
serde_bytes = "0.11"
sha1 = { version = "0.10.6", features = ["oid"] }
sha2 = { version = "0.10.8", features = ["oid"] }
sha3 = "0.10.8"
signature = "2.1"
spki = "0.7.2"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["full"] }
uuid = { version = "1.3.0", features = ["v4"] }
x25519-dalek = "2.0.0"
