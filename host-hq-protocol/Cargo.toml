[package]
name = "fn0-host-hq-protocol"
version = "0.2.1"
edition = "2024"
description = "Protocol definitions for fn0 host-HQ communication"
license = "AGPL-3.0-only"
repository = "https://github.com/NamseEnt/fn0"

[dependencies]
bytes = "1.11.0"
postcard = { version = "1.1.3", default-features = false, features = [
    "use-std",
] }
serde = { version = "1", features = ["derive"] }
