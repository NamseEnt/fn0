name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      libsql:
        image: ghcr.io/tursodatabase/libsql-server:latest
        ports:
          - 18123:8080
        env:
          SQLD_NODE_NAME: primary

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup update stable
          rustup target add wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      # v8's build script skips its prebuilt-archive download whenever the
      # checksum file matches, without verifying the archive exists. A cache
      # restore can lose the ~130MB librusty_v8.a while keeping the checksum,
      # which silently breaks the link; drop the checksum so it re-downloads.
      - name: Repair v8 archive cache
        run: |
          find target -path '*/gn_out/obj/*.sum' -print0 |
          while IFS= read -r -d '' sum; do
            [ -f "${sum%.sum}" ] || rm -f "$sum"
          done

      # Plain `cargo fmt` covers the workspace members only; `--all` is not
      # used because it also follows path dependencies and would reformat the
      # vendored deno crates. vendor/ is never checked; it keeps upstream
      # deno's style.
      - name: Fmt workspace
        run: cargo fmt --check

      # The crates under test build for wasm32-wasip2, so cargo runs their test
      # binaries through this runner rather than executing them directly. It is
      # built into the shared target dir instead of `cargo install`ing so the
      # cache covers wasmtime, which dominates its build.
      - name: Build forte-test-runner
        run: |
          cargo build --release -p forte-test-runner
          echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"

      - name: Wait for libsql
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18123/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "libsql did not become healthy" >&2
          exit 1

      # doc-db and object-storage build their test targets for wasm32-wasip2
      # from their own directories, so the workspace-wide commands cannot reach
      # them and they keep their own steps below. forte-cli is covered by the
      # forte-cli job.
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets --exclude fn0-doc-db --exclude fn0-object-storage -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --exclude fn0-doc-db --exclude fn0-object-storage --exclude forte-cli

      - name: Test doc-db
        working-directory: doc-db
        run: cargo test

      - name: Clippy doc-db
        working-directory: doc-db
        run: cargo clippy --all-targets -- -D warnings

      - name: Test object-storage
        working-directory: object-storage
        run: cargo test

      - name: Clippy object-storage
        working-directory: object-storage
        run: cargo clippy --all-targets -- -D warnings

      # Its own workspace root, so no workspace-wide command reaches it.
      - name: Test fn0-control
        working-directory: fn0/control/rs
        run: cargo test

      - name: Clippy fn0-control
        working-directory: fn0/control/rs
        run: cargo clippy --all-targets -- -D warnings

      # Runs after the control build because build.rs generates
      # src/route_generated.rs, which rustfmt has to resolve as a module.
      - name: Fmt fn0-control
        working-directory: fn0/control/rs
        run: cargo fmt --check

      # Also its own workspace root, and it carries no tests. Its
      # rust-toolchain.toml pins a nightly that rustup installs on entry.
      - name: Clippy forte-rs-to-ts
        working-directory: forte/rs-to-ts
        run: cargo clippy --all-targets -- -D warnings

      - name: Fmt forte-rs-to-ts
        working-directory: forte/rs-to-ts
        run: cargo fmt --check

  forte-cli:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup update stable
          rustup target add wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      # Each test runs `forte init` and then a real `forte build` or `forte dev`
      # in a temp project: npm install, vite, sqld and a full wasm app build.
      # Kept off the unit gate so an npm registry outage cannot mask a real
      # regression behind fail-fast.
      - name: Test forte-cli
        run: cargo test -p forte-cli
