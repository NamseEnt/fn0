name: Publish Crates

on:
  push:
    branches: [main]
    paths:
      - "fn0/**"
      - "adapt-cache/**"
      - "oci-rust-sdk/**"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish oci-rust-sdk
        working-directory: oci-rust-sdk
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.OCI_RUST_SDK_CARGO_TOKEN }}

      - name: Publish fn0-adapt-cache
        working-directory: adapt-cache
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for deps to propagate
        run: sleep 30

      - name: Publish fn0
        working-directory: fn0
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
