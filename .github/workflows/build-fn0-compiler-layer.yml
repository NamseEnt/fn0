name: Build fn0-compiler Lambda Layer

on:
  push:
    branches: [main]
    paths:
      - "fn0-compiler/**"
      - "fn0/**"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build fn0-compiler
        working-directory: fn0-compiler
        run: cargo build --release

      - name: Package fn0-compiler Lambda layer
        run: |
          mkdir -p layer
          cp fn0-compiler/target/release/fn0-compiler layer/
          cd layer
          tar cJf ../infra/pulumi/BuildChain/fn0-compiler-layer.tar.xz fn0-compiler

      - name: Build zstd for arm64
        run: |
          sudo apt-get update && sudo apt-get install -y zstd
          cp $(which zstd) infra/pulumi/BuildChain/zstd-arm64

      - name: Upload fn0-compiler layer
        uses: actions/upload-artifact@v4
        with:
          name: fn0-compiler-layer
          path: infra/pulumi/BuildChain/fn0-compiler-layer.tar.xz

      - name: Upload zstd-arm64
        uses: actions/upload-artifact@v4
        with:
          name: zstd-arm64
          path: infra/pulumi/BuildChain/zstd-arm64
