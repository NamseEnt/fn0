name: Publish crates

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.RELEASE_PAT }}
          persist-credentials: true

      - name: Install Rust
        run: rustup update stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-release

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish unpublished workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo release publish --workspace --execute --no-confirm

      - name: Create release tags
        shell: bash
        run: |
          set -euo pipefail

          tag_if_needed() {
            local dir="$1"
            local tag_prefix="$2"

            local local_ver=$(grep '^version' "$dir/Cargo.toml" | head -1 | sed 's/version = "\(.*\)"/\1/')
            local tag="${tag_prefix}-v${local_ver}"

            if git ls-remote --tags origin | grep -q "refs/tags/${tag}$"; then
              return
            fi

            echo "Creating tag $tag"
            git tag "$tag"
            git push origin "$tag"
          }

          tag_if_needed "forte/cli" "forte-cli"
          tag_if_needed "forte/rs-to-ts" "forte-rs-to-ts"
