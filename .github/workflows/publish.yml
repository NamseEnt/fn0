name: Publish crates

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-22.04
    # The repo is public, so the default token is enough for the checkout
    # and for the tag pushes below. The old RELEASE_PAT lost its repo scope
    # when the repository path changed case and is no longer set.
    # Tags pushed with the default token do not trigger other workflows, so
    # each release workflow is dispatched explicitly, which needs actions: write.
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Install Rust
        run: rustup update stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-release

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish unpublished workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set +e
          cargo release publish --workspace --execute --no-confirm
          rc=$?
          set -e
          if [[ $rc -ne 0 && $rc -ne 2 ]]; then
            exit $rc
          fi

      - name: Create release tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          tag_if_needed() {
            local dir="$1"
            local tag_prefix="$2"
            local release_workflow="$3"

            local local_ver=$(grep '^version' "$dir/Cargo.toml" | head -1 | sed 's/version = "\(.*\)"/\1/')
            local tag="${tag_prefix}-v${local_ver}"

            # ls-remote --exit-code avoids piping into `grep -q`, which SIGPIPEs
            # under `set -o pipefail` and so misdetects an existing tag.
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              return
            fi

            echo "Creating tag $tag"
            git tag "$tag"
            git push origin "$tag"
            gh workflow run "$release_workflow" --ref "$tag" -f tag="$tag"
          }

          tag_if_needed "forte/cli" "release/forte-cli" "release-release.yml"
          tag_if_needed "forte/rs-to-ts" "forte-rs-to-ts" "release-forte-rs-to-ts.yml"
          tag_if_needed "fn0/cli" "release/fn0-cli" "release-release.yml"
