[package]
name = "forte-sdk"
version = "0.2.3"
edition = "2024"
description = "Core SDK for the Forte web framework"
license = "AGPL-3.0-only"
repository = "https://github.com/NamseEnt/fn0"

[features]
dev-test = ["forte-db/dev-test"]

[dependencies]
anyhow = { version = "1", features = ["backtrace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
wstd = "0.6"
forte-json = { version = "0.1.0", path = "../forte-json" }
forte-db = { version = "0.2.5", path = "../db" }
cookie = { version = "0.18", features = ["percent-encode"] }
syn = { version = "2.0", features = ["full"] }
quote = "1"
proc-macro2 = "1"
prettyplease = "0.2"
sha2 = "0.10.9"
hmac = "0.12.1"
hex = "0.4.3"
chrono = { version = "0.4.42", features = ["serde"] }
futures = "0.3.31"
time = "0.3.44"
uuid = { version = "1.19.0", features = ["v7"] }
form_urlencoded = "1.2.2"
forte-macros = { version = "0.5.0", path = "../macros" }
