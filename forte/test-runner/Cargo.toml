[package]
name = "forte-test-runner"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Runs wasi:http@0.3 wasm test binaries (cargo test runner for doc-db)"

[package.metadata.release]
release = false

[package.metadata.dist]
dist = false

[[bin]]
name = "forte-test-runner"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time"] }
wasmparser = { workspace = true }
wasmtime = { workspace = true, default-features = true, features = ["component-model-async"] }
wasmtime-wasi = { workspace = true, features = ["p3"] }
wasmtime-wasi-http = { workspace = true, features = ["p3"] }
