[package]
name = "forte-cli"
version = "0.3.12"
edition = "2024"
description = "CLI for the Forte fullstack web framework"
license = "AGPL-3.0-only"
repository = "https://github.com/NamseEnt/fn0"

[[bin]]
name = "forte"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[workspace]

[dependencies]
fn0 = { version = "0.2", path = "../../fn0" }
adapt-cache = { package = "fn0-adapt-cache", version = "0.1.2" }
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1", features = [
    "service",
    "client-legacy",
    "http1",
    "tokio",
] }
bytes = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
http-body-util = "0.1"
tower = "0.5"
clap = { version = "4", features = ["derive"] }
notify = "8"
notify-debouncer-mini = "0.6"
http = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
fn0-deploy = { path = "../../fn0-deploy" }
uuid = { version = "1", features = ["v4"] }
tokio-util = "0.7"


[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
] }
