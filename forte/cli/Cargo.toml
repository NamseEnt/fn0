[package]
name = "forte-cli"
version = "0.2.1"
edition = "2024"
description = "CLI for the Forte fullstack web framework"
license = "AGPL-3.0-only"
repository = "https://github.com/NamseEnt/fn0"

[[bin]]
name = "forte"
path = "src/main.rs"

[workspace]

[dependencies]
fn0 = "0.1.0"
adapt-cache = { package = "fn0-adapt-cache", version = "0.1.2" }
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1", features = [
    "service",
    "client-legacy",
    "http1",
    "tokio",
] }
bytes = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
http-body-util = "0.1"
tower = "0.5"
clap = { version = "4", features = ["derive"] }
notify = "8"
notify-debouncer-mini = "0.6"
tokio-tungstenite = "0.24"
futures-util = "0.3"
http = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

# OXC for TypeScript/JSX transformation
oxc_allocator = "0.96"
oxc_ast = "0.96"
oxc_parser = "0.96"
oxc_semantic = "0.96"
oxc_transformer = "0.96"
oxc_codegen = "0.96"
oxc_span = "0.96"

# For content hashing
sha2 = "0.10"
hex = "0.4"
regex = "1"

[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
] }
