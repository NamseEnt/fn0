[package]
name = "forte-cli"
version = "0.3.26"
edition = "2024"
description = "CLI for the Forte fullstack web framework"
license = "AGPL-3.0-only"
repository = "https://github.com/NamseEnt/fn0"

[[bin]]
name = "forte"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[dependencies]
fn0 = { workspace = true }
tokio = { workspace = true, features = ["full"] }
hyper = { workspace = true, features = ["server", "http1", "client"] }
hyper-util = { workspace = true, features = [
    "service",
    "client-legacy",
    "http1",
    "tokio",
] }
bytes = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
http-body-util = { workspace = true }
tower = { workspace = true }
clap = { workspace = true, features = ["derive"] }
notify = "8"
notify-debouncer-mini = "0.6"
http = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
fn0-deploy = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
tokio-util = { workspace = true }
rustls = { workspace = true }
futures = { workspace = true }


[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
