[package]
name = "forte"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
fn0 = { path = "../../fn0" }
ski = { path = "../../ski/ski" }
adapt-cache = { path = "../../adapt-cache" }
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1", features = [
    "service",
    "client-legacy",
    "http1",
    "tokio",
] }
bytes = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
http-body-util = "0.1"
tower = "0.5"
clap = { version = "4", features = ["derive"] }
notify = "8"
notify-debouncer-mini = "0.6"
tokio-tungstenite = "0.24"
futures-util = "0.3"
http = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

# OXC for TypeScript/JSX transformation
oxc_allocator = "0.96"
oxc_ast = "0.96"
oxc_parser = "0.96"
oxc_semantic = "0.96"
oxc_transformer = "0.96"
oxc_codegen = "0.96"
oxc_span = "0.96"

# For content hashing
sha2 = "0.10"
hex = "0.4"
regex = "1"
base64 = "0.22"
url = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
] }
