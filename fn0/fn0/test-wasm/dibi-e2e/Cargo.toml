[package]
name = "dibi-e2e"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.104"
doc-db = { package = "fn0-doc-db", path = "../../../../doc-db" }
forte-sdk = { path = "../../../../forte/sdk" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"

[workspace]

[profile.release]
debug = true
opt-level = "s"
strip = true
