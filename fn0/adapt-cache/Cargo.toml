[package]
name = "fn0-adapt-cache"
version = "0.1.2"
edition = "2024"
description = "Adaptive caching layer with S3 backend support"
license = "AGPL-3.0-only"
repository = "https://github.com/NamseEnt/fn0"

[dependencies]
async_singleflight = "0.6"
aws-sdk-s3 = { version = "=1.115.0", default-features = false }
bytes = "1"
anyhow = "1"
tokio = { version = "1.48", features = ["fs", "rt", "test-util"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.48", features = ["macros", "test-util"] }
aws-config = { version = "1.1.7", features = ["behavior-version-latest"] }
aws-smithy-mocks = "0.2"
aws-smithy-runtime-api = "1.7"
aws-smithy-types = "1.3"
aws-sdk-s3 = { version = "=1.115.0", features = ["test-util"] }
