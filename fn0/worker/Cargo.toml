[package]
name = "fn0-worker"
version = "0.3.8"
edition = "2024"
description = "Worker binary for the fn0 FaaS platform"
license = "AGPL-3.0-only"
repository = "https://github.com/NamseEnt/fn0"

[dependencies]
fn0 = { workspace = true }
async_singleflight = { workspace = true }
futures = { workspace = true }
opendal = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
color-eyre = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["full"] }
hyper-util = { workspace = true, features = ["full"] }
rustls = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = "0.32"
opentelemetry = { version = "0.31", features = ["logs", "metrics"] }
opentelemetry_sdk = { version = "0.31", features = ["logs", "rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = ["http-proto", "reqwest-client", "metrics", "logs"] }
opentelemetry-http = { version = "0.31", features = ["reqwest"] }
reqwest = { workspace = true }
http = { workspace = true }
async-trait = "0.1"
anyhow = { workspace = true }
zstd = "0.13"
tar = "0.4"
aes-gcm = "0.10"
opentelemetry-appender-tracing = "0.31"
