[package]
name = "dodb-server"
version = "0.1.0"
edition.workspace = true
license = "MIT"
description = "Server for dodb, the fn0 document database"
repository.workspace = true

[dependencies]
clap = { workspace = true, features = ["derive"] }
dodb-core.workspace = true
dodb-protocol.workspace = true
dodb-service.workspace = true
dodb-storage.workspace = true
async-trait.workspace = true
bytes.workspace = true
http.workspace = true
opentelemetry = { workspace = true, features = ["metrics"] }
opentelemetry-http = { workspace = true, features = ["reqwest"] }
opentelemetry-otlp = { workspace = true, features = ["http-proto", "reqwest-client", "metrics"] }
opentelemetry_sdk = { workspace = true, features = ["metrics", "rt-tokio", "spec_unstable_metrics_views"] }
quinn = { workspace = true, default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
reqwest.workspace = true
rustls-pemfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
dodb-client.workspace = true
quinn = { workspace = true, default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rcgen.workspace = true
tempfile.workspace = true
