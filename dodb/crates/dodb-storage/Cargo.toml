[package]
name = "dodb-storage"
version = "0.1.0"
edition.workspace = true
license = "MIT"
description = "Storage engine for dodb, the fn0 document database"
repository.workspace = true

[dependencies]
blake3.workspace = true
crc32c.workspace = true
dodb-core.workspace = true
libc.workspace = true
mimalloc.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }

[features]
churn-counters = []
phase-i-instrumentation = []
blink-read-metrics-disabled = []
blink-borrowed-page-views = []
blink-writer-pin-reuse = []
blink-checkpoint-locators = []
blink-demand-paging = ["blink-checkpoint-locators"]

[dev-dependencies]
proptest.workspace = true
