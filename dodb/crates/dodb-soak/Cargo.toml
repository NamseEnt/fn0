[package]
name = "dodb-soak"
version = "0.1.0"
edition.workspace = true
license = "MIT"

[dependencies]
dodb-client = { path = "../dodb-client" }
dodb-core = { path = "../dodb-core" }
dodb-protocol = { path = "../dodb-protocol" }
dodb-server = { path = "../dodb-server" }
dodb-service = { path = "../dodb-service" }
dodb-storage = { path = "../dodb-storage" }
mimalloc = { workspace = true, features = ["extended"] }
rcgen.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile.workspace = true
