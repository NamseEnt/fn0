[package]
name = "dodb-soak"
version = "0.1.0"
edition.workspace = true
license = "MIT"

[package.metadata.release]
release = false

[dependencies]
dodb-client.workspace = true
dodb-core.workspace = true
dodb-protocol.workspace = true
dodb-server.workspace = true
dodb-service.workspace = true
dodb-storage.workspace = true
mimalloc = { workspace = true, features = ["extended"] }
rcgen.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile.workspace = true
