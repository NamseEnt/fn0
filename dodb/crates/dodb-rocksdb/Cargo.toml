[package]
name = "dodb-rocksdb"
version = "0.1.0"
edition.workspace = true
license = "MIT"
description = "Experimental RocksDB-backed dodb service"
repository.workspace = true
build = "build.rs"

[dependencies]
dodb-core.workspace = true
dodb-client.workspace = true
dodb-protocol.workspace = true
dodb-service.workspace = true
dodb-server.workspace = true
dodb-storage.workspace = true
libc.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
rcgen.workspace = true
sha2.workspace = true
tempfile.workspace = true
dashmap.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }

[build-dependencies]
cc.workspace = true

[dev-dependencies]
dodb-server.workspace = true
dodb-storage.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
