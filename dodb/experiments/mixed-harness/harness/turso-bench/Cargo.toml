[package]
name = "turso-bench"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
turso = { git = "https://github.com/tursodatabase/turso", rev = "418ef1c3e8e4975597be5882ebcf1d03c3ce83aa" }
tokio = { version = "1", features = ["rt", "time"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
debug = "line-tables-only"
codegen-units = 4
panic = "abort"
lto = "thin"
