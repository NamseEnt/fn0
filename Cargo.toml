[workspace]
resolver = "3"
members = ["fn0/*", "forte/*", "doc-db"]
exclude = ["vendor/*", "forte/rs-to-ts"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/NamseEnt/fn0"

[workspace.dependencies]
fn0 = { path = "fn0/fn0", version = "=0.2.24" }
fn0-deploy = { path = "fn0/deploy", version = "=0.1.4" }
fn0-wasmtime = { path = "fn0/wasmtime", version = "=0.1.3" }
ski = { package = "fn0-ski", path = "fn0/ski", version = "=0.1.4" }
doc-db = { path = "doc-db", version = "=0.4.0" }
forte-json = { path = "forte/json", version = "=0.1.1" }
forte-macros = { path = "forte/macros", version = "=0.5.1" }
forte-sdk = { path = "forte/sdk", version = "=0.3.2" }

aes-gcm = "=0.10.3"
anyhow = "=1.0.100"
assert_cmd = "=2.2.1"
async_singleflight = "=0.6.2"
async-trait = "=0.1.89"
base64 = "=0.22.1"
boxcar = "=0.2.14"
bytes = "=1.11.1"
chrono = "=0.4.42"
clap = "=4.5.60"
color-eyre = "=0.6.5"
cookie = "=0.18.1"
crossbeam-channel = "=0.5.15"
dashmap = "=6.1.0"
deno_core = "=0.394.0"
deno_error = "=0.7.1"
deno_webidl = "=0.241.0"
dirs = "=6.0.0"
encoding_rs = "=0.8.35"
form_urlencoded = "=1.2.2"
futures = "=0.3.31"
h2 = "=0.4.13"
hex = "=0.4.3"
hmac = "=0.12.1"
http = "=1.4.0"
http-body = "=1.0.1"
http-body-util = "=0.1.3"
hyper = "=1.8.1"
hyper-rustls = { version = "=0.27.7", default-features = false, features = ["webpki-roots", "http1", "http2", "ring", "tls12", "logging"] }
hyper-util = "=0.1.20"
include_dir = "=0.7.4"
inquire = "=0.9.4"
libsql = "=0.9.29"
libsql-hrana = "=0.9.29"
memberlist = { version = "=0.7.0", features = ["snappy", "tokio", "quinn"] }
mockall = "=0.13.1"
notify = "=8.2.0"
notify-debouncer-mini = "=0.6.0"
oci-rust-sdk = "=0.4.4"
opendal = { version = "=0.55.0", default-features = false, features = ["services-s3", "executors-tokio"] }
opentelemetry = "=0.31.0"
opentelemetry-appender-tracing = "=0.31.1"
opentelemetry-http = "=0.31.0"
opentelemetry-otlp = "=0.31.1"
opentelemetry-proto = { version = "=0.31.0", default-features = false }
opentelemetry_sdk = { version = "=0.31.0", default-features = false }
prost = "=0.14.3"
predicates = "=3.1.4"
prettyplease = "=0.2.37"
proc-macro2 = "=1.0.105"
quote = "=1.0.45"
rand = "=0.8.5"
rcgen = "=0.14.7"
reqsign = { version = "=0.16.5", default-features = false, features = ["services-aws", "reqwest_request"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-webpki-roots-no-provider", "json"] }
russh = "=0.60.1"
rustls = { version = "=0.23.28", default-features = false, features = ["logging", "std", "tls12", "aws_lc_rs"] }
rustls-pemfile = "=2.2.0"
rustls-pki-types = "=1.13.2"
schemars = "=0.8.22"
serde = "=1.0.228"
serde_json = "=1.0.148"
sha2 = "=0.10.9"
singleflight = "=0.3.0"
socket2 = "=0.6.1"
sonic-rs = "=0.5.8"
struson = "=0.7.2"
syn = { version = "=2.0.113", features = ["full"] }
sysinfo = "=0.37.2"
tar = "=0.4.45"
tempfile = "=3.27.0"
thiserror = "=2.0.18"
time = "=0.3.44"
tokio = "=1.49.0"
tokio-rustls = "=0.26.4"
tokio-util = "=0.7.18"
toml = "=0.8.23"
tower = "=0.5.3"
tower-http = "=0.6.8"
tracing = "=0.1.44"
tracing-opentelemetry = { version = "=0.32.1", default-features = false }
tracing-subscriber = { version = "=0.3.23", default-features = false }
uuid = "=1.19.0"
wasmtime = { version = "=43.0.1", default-features = false }
wasmtime-wasi = "=43.0.1"
wasmtime-wasi-http = "=43.0.1"
wiremock = "=0.6.5"
wit-bindgen = { version = "=0.50.0", features = ["default", "async-spawn", "inter-task-wakeup"] }
zstd = "=0.13.3"

[profile.release]
debug = true

[profile.dist]
inherits = "release"
lto = "thin"
